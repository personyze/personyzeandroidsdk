# Versions are pinned on purpose. Two traps decide most of them:
#
# * AGP 9 compiles Kotlin itself (built-in Kotlin) with the Kotlin Gradle plugin its POM depends on,
#   2.2.10 for AGP 9.4.1. The compose and serialization compiler plugins must be the same version,
#   and a library built with newer Kotlin metadata (kotlinx-serialization 1.11+) does not compile.
# * A library's `minCompileSdk` becomes every app's. androidx core 1.17+ wants 36, 1.19 and Compose
#   UI 1.12 want 37 - so the published modules stay on versions that ask for 35 or less, and only
#   the test app may use newer ones.

[versions]
personyze = "2.0.0"
agp = "9.4.1"
kotlin = "2.2.10"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.3.2"
androidx-core = "1.16.0"
work = "2.10.5"
webkit = "1.14.0"
compose-ui = "1.9.5"
androidsvg = "1.4"
junit = "4.13.2"
robolectric = "4.16.1"
androidx-test = "1.7.0"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"
turbine = "1.2.1"

[libraries]
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-ui" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
espresso-web = { module = "androidx.test.espresso:espresso-web", version.ref = "espresso" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
